name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install betterleaks
        env:
          VERSION: "1.9.0"
          SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl -fsSLo bl.tgz "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  bl.tgz" | sha256sum -c -
          sudo tar -xzf bl.tgz -C /usr/local/bin betterleaks && rm bl.tgz
      - run: just check-ci

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g clawhub
      # Without the publisher identity a slug another publisher also owns resolves as ambiguous.
      - name: Authenticate to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser
      - run: just preflight

  release:
    if: github.event_name == 'push'
    needs: [check, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-skills
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g clawhub
      - name: Authenticate to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser
      - name: Publish changed skills
        env:
          CLAWHUB_DISABLE_TELEMETRY: "1"
          GH_TOKEN: ${{ github.token }}
        run: just release
