name: Release Skills

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      # Must precede `just check`: its ClawHub preflight needs the publisher
      # identity to resolve slugs another publisher also owns.
      - name: Authenticate to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          [ -n "$CLAWHUB_TOKEN" ] || (echo "CLAWHUB_TOKEN secret is required." && exit 1)
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Validate repository
        run: just check
      - name: Ensure no uncommitted changes
        run: git diff --exit-code

      # A release tag advances only on success, so a failed run's commits stay in
      # the next run's range instead of vanishing between two push events.
      - name: Resolve last released commit
        id: base
        run: |
          echo "ref=$(git describe --tags --match 'skills-*' --abbrev=0 HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        id: prepare
        run: |
          just release-prepare "${{ steps.base.outputs.ref }}" "${{ github.sha }}" "$GITHUB_OUTPUT"

      - name: Stop when no skills changed
        if: steps.prepare.outputs.changed != 'true'
        run: echo "No skill changes detected."

      - name: Publish changed skills to ClawHub
        if: steps.prepare.outputs.publishable == 'true'
        env:
          CLAWHUB_DISABLE_TELEMETRY: "1"
        run: just release-publish "${{ steps.prepare.outputs.manifest_path }}"

      # Without target_commitish the tag lands on main's current tip, so a merge that
      # lands mid-run gets tagged as released and the next run skips it.
      - name: Create GitHub release with bundles
        if: steps.prepare.outputs.publishable == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prepare.outputs.title }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          files: |
            dist/releases/manifest.json
            dist/releases/release-notes.md
            dist/releases/bundles/*.zip

      - name: Create GitHub release without bundles
        if: steps.prepare.outputs.changed == 'true' && steps.prepare.outputs.publishable != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prepare.outputs.title }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          files: |
            dist/releases/manifest.json
            dist/releases/release-notes.md

      - name: Refresh skills-latest rolling bundles
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just release-latest-bundles
