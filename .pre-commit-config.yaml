# These local hooks mirror every check `just check` runs, so a commit that would
# fail CI fails here instead - except the ClawHub preflight, which needs the network
# and a login and so would make every commit depend on a third-party service. That one
# runs at pre-push instead: once per push rather than once per commit.
#
# default_stages keeps the commit-stage hooks off pre-push; without it pre-commit runs
# every hook at every stage and a push would repeat the whole commit suite.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: lint-skills
        name: lint-skills
        entry: uv run python scripts/check_skills.py --no-preflight
        language: system
        pass_filenames: false

      - id: clawhub-preflight
        name: clawhub-preflight
        entry: uv run python scripts/check_skills.py --preflight-only
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: lint-python
        name: lint-python
        entry: uv run ruff check scripts
        language: system
        pass_filenames: false

      - id: format-python
        name: format-python
        entry: uv run ruff format --check scripts
        language: system
        pass_filenames: false

      - id: typecheck-python
        name: typecheck-python
        entry: uv run ty check scripts
        language: system
        pass_filenames: false

      # --check, not a regenerate: rewriting README.md mid-commit would stage a
      # file the author never saw.
      - id: readme-sync
        name: readme-sync
        entry: uv run python scripts/generate_readme.py --check
        language: system
        pass_filenames: false

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (pnpm-lock\.yaml|(skills|archive)/.*/references/.*\.md)

  # Standard checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # These declare their own stages upstream, so the top-level default_stages does
      # not reach them. Pinned explicitly: the first two rewrite files, and a mutating
      # hook at push time fails the push and leaves edits behind.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
